<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Launch | SafeRoute</title>

    <link rel="stylesheet" href="../../assets/styles/global.css">
    <link rel="stylesheet" href="../../assets/styles/launch/launch_auth.css">

</head>

<body>

    <main class="launch-page">

        <section class="launch-content">


            <div class="launch-brand">

                <img
                    class="launch-logo"
                    src="../../assets/images/launch/logo.png"
                    alt="SafeRoute Logo"
                >

                <h1 class="launch-title">
                    SafeRoute
                </h1>

                <p class="launch-subtitle">
                    Tu seguridad es nuestra prioridad
                </p>

            </div>



            <div class="launch-actions">

                <button
                    id="start-button"
                    class="primary-button"
                    type="button">
                    Empezar
                </button>


                <button
                    id="account-button"
                    class="secondary-button"
                    type="button">
                    Ya Tengo Cuenta
                </button>

            </div>



            <div class="terms-text">

                <p>
                    Al Continuar, Aceptas Nuestros
                </p>

                <span>
                    Terminos De Uso Y Aviso De Privacidad
                </span>

            </div>


        </section>


    </main>


    <script src="../../assets/scripts/launch/launch_auth.js"></script>

</body>

</html>
