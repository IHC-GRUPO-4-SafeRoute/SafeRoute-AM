<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rutas guardadas | SafeRoute</title>

  <link rel="stylesheet" href="../../assets/styles/global.css" />
  <link rel="stylesheet" href="../../assets/styles/routes/routes_saved_empty.css" />
</head>

<body>
  <main class="app-container">
    <header class="routes-header">
      <button class="back-button" type="button" aria-label="Volver">
        <img src="../../assets/images/routes/Back_icon.png" alt="" />
      </button>

      <div class="header-title">
        <h1>Rutas frecuentes</h1>
      </div>

      <button class="notification-button" type="button" aria-label="Notificaciones">
        <img src="../../assets/images/routes/Notifications_icon.png" alt="" />
      </button>
    </header>

    <section class="saved-empty-content">
      <article class="saved-empty-panel">
        <div class="tabs">
          <button class="tab-button favorite-tab-button" type="button">Favoritas</button>
          <button class="tab-button active saved-tab-button" type="button">Guardadas</button>
        </div>

        <p class="empty-message">No se encuentran rutas nuevas guardadas</p>
      </article>

      <button class="save-route-button" type="button">
        <span>+</span>
        Guardar nueva ruta
      </button>
    </section>

    <nav class="bottom-nav">
      <a class="nav-item" href="../home/home.html">
        <img src="../../assets/images/routes/Home_icon.png" alt="" />
        <span>Inicio</span>
      </a>

      <a class="nav-item active" href="./routes_safe_routes.html">
        <img src="../../assets/images/routes/Routes_icon.png" alt="" />
        <span>Rutas</span>
      </a>

      <a class="nav-item" href="../alerts/alerts.html">
        <img src="../../assets/images/routes/alert_icon.png" alt="" />
        <span>Alertas</span>
      </a>

      <a class="nav-item" href="../reports/reports.html">
        <img src="../../assets/images/routes/report_icon.png" alt="" />
        <span>Reportes</span>
      </a>

      <a class="nav-item" href="../configuration/profile.html">
        <img src="../../assets/images/routes/configuration_icon.png" alt="" />
        <span>Perfil</span>
      </a>
    </nav>
  </main>

  <script src="../../assets/scripts/i18n/i18n.js"></script>
  <script src="../../assets/scripts/routes/routes_saved_empty.js"></script>
</body>
</html>
