<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña | SafeRoute</title>

    <link rel="stylesheet"href="../../assets/styles/global.css">
    <link rel="stylesheet"href="../../assets/styles/login-sign_up/new_password.css">
</head>

<body>
    <main class="new-password-page">
        <header class="new-password-header">
            <h1>Nueva contraseña</h1>
        </header>

        <section class="new-password-content">

            <form
                id="new-password-form"
                class="new-password-form"
            >

                <div class="new-password-group">

                    <label for="new-password">
                        Nueva contraseña
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="new-password"
                            name="new-password"
                            placeholder="Ingrese su nueva contraseña"
                            autocomplete="new-password"
                            minlength="13"
                            maxlength="13"
                            required
                        >

                        <button
                            type="button"
                            id="show-new-password"
                            class="show-password-button"
                            aria-label="Mostrar nueva contraseña"
                        >
                            <img
                                id="new-password-eye-icon"
                                src="../../assets/images/login-sign_up/close_eye.png"
                                alt=""
                            >
                        </button>

                    </div>

                </div>

                <div class="new-password-group">

                    <label for="confirm-new-password">
                        Confirmar nueva contraseña
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="confirm-new-password"
                            name="confirm-new-password"
                            placeholder="Confirme su nueva contraseña"
                            autocomplete="new-password"
                            minlength="13"
                            maxlength="13"
                            required
                        >

                        <button
                            type="button"
                            id="show-confirm-new-password"
                            class="show-password-button"
                            aria-label="Mostrar confirmación de contraseña"
                        >
                            <img
                                id="confirm-new-password-eye-icon"
                                src="../../assets/images/login-sign_up/close_eye.png"
                                alt=""
                            >
                        </button>

                    </div>

                </div>

                <p
                    id="new-password-message"
                    class="new-password-message"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    class="change-password-button"
                >
                    Cambiar contraseña
                </button>

            </form>
        </section>
    </main>
    <script src="../../assets/scripts/login-sign_up/new_password.js"></script>
</body>
</html>
