<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nodos Seguros | SafeRoute</title>

  <link rel="stylesheet" href="../../assets/styles/global.css" />
  <link rel="stylesheet" href="../../assets/styles/routes/routes_safe_nodes.css" />
</head>

<body>
  <main class="safe-nodes-page">
    <header class="safe-nodes-header">
      <button class="back-button" type="button" aria-label="Volver">&lt;</button>
      <h1>Nodos Seguros</h1>
      <span></span>

    <section class="safe-nodes-card">
      <h2>Nodos Seguros en tu ruta</h2>
      <div class="safe-nodes-divider"></div>

      <article class="safe-node-item">
        <img src="../../assets/images/routes/Shield_green.png" alt="" />
        <div>
          <h3>Bodega “Lupita” → 500 m</h3>
          <p>A 5 minutos de distancia</p>
        </div>
      </article>

      <article class="safe-node-item">
        <img src="../../assets/images/routes/Shield_green.png" alt="" />
        <div>
          <h3>Mercado “García” → 500 m</h3>
          <p>A 15 minutos de distancia</p>
        </div>
      </article>

      <article class="safe-node-item">
        <img src="../../assets/images/routes/Shield_green.png" alt="" />
        <div>
          <h3>Bodega “Javier” → 500 m</h3>
          <p>A 21 minutos de distancia</p>
        </div>
      </article>

      <article class="safe-node-item">
        <img src="../../assets/images/routes/Shield_green.png" alt="" />
        <div>
          <h3>Tambo Primavera → 500 m</h3>
          <p>A 26 minutos de distancia</p>
        </div>
      </article>

      <article class="safe-node-item">
        <img src="../../assets/images/routes/Shield_green.png" alt="" />
        <div>
          <h3>Mass Primavera → 500 m</h3>
          <p>A 34 minutos de distancia</p>
        </div>
      </article>
    </section>

    <button class="return-map-button" type="button">Regresar al mapa</button>
  </main>

  <script src="../../assets/scripts/routes/routes_safe_nodes.js"></script>
</body>
</html>
