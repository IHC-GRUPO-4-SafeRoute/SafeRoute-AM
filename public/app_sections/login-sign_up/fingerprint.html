<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>Huella digital | SafeRoute</title>

    <link rel="stylesheet"href="../../assets/styles/global.css">
    <link rel="stylesheet"href="../../assets/styles/login-sign_up/fingerprint.css">
</head>

<body>

    <main class="fingerprint-page">
        <header class="fingerprint-header">
            <h1>Huella digital</h1>
        </header>

        <section class="fingerprint-content">

            <div class="fingerprint-icon-container">

                <img src="../../assets/images/login-sign_up/icon-fingerprint.png" alt="Huella digital" class="fingerprint-icon">
            </div>

            <div class="fingerprint-information">

                <h2>
                    Usa tu huella para acceder
                </h2>

                <p>
                    Ingresa de manera más rápida con un solo toque
                    utilizando tu huella digital.
                </p>

            </div>


            <p
                id="fingerprint-message"
                class="fingerprint-message"
                aria-live="polite"
            ></p>

            <button
                type="button"
                id="use-fingerprint"
                class="use-fingerprint-button"
            >
                Usar huella
            </button>

        </section>
    </main>
    <script src="../../assets/scripts/i18n/i18n.js"></script>
<script src="../../assets/scripts/login-sign_up/fingerprint.js"></script>
</body>
</html>
