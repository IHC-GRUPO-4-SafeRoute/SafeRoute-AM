<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incidencias en ruta | SafeRoute</title>

  <link rel="stylesheet" href="../../assets/styles/global.css" />
  <link rel="stylesheet" href="../../assets/styles/routes/routes_incidents.css" />
</head>

<body>
  <main class="incidents-page">
    <header class="incidents-header">
      <button class="back-button" type="button" aria-label="Volver">&lt;</button>
      <h1>Incidencias en ruta</h1>
      <span></span>
    </header>

    <section class="incidents-card">
      <h2>Incidencias en tu ruta</h2>
      <div class="incidents-divider"></div>

      <article class="incident-item">
        <img src="../../assets/images/routes/Dangerous_icon.png" alt="" />
        <div>
          <h3>Zona de baja iluminación</h3>
          <p>Reportado hace 4 minutos</p>
        </div>
      </article>

      <article class="incident-item">
        <img src="../../assets/images/routes/Dangerous_icon.png" alt="" />
        <div>
          <h3>Zona con baja densidad de tránsito</h3>
          <p>Reportado hace 6 minutos</p>
        </div>
      </article>

      <article class="incident-item">
        <img src="../../assets/images/routes/Dangerous_icon.png" alt="" />
        <div>
          <h3>Robo de motorizado</h3>
          <p>Reportado hace 20 minutos</p>
        </div>
      </article>

      <article class="incident-item">
        <img src="../../assets/images/routes/Dangerous_icon.png" alt="" />
        <div>
          <h3>Zona con baja iluminación</h3>
          <p>Reportado hace 41 minutos</p>
        </div>
      </article>
    </section>

    <button class="return-map-button" type="button">Regresar al mapa</button>
  </main>

  <script src="../../assets/scripts/routes/routes_incidents.js"></script>
</body>
</html>
