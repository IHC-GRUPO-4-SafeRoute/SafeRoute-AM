<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva ruta | SafeRoute</title>

  <link rel="stylesheet" href="../../assets/styles/global.css" />
  <link rel="stylesheet" href="../../assets/styles/routes/routes_new_route.css" />
</head>

<body>
  <main class="new-route-page">
    <header class="new-route-header">
      <button class="back-button" type="button" aria-label="Volver">&lt;</button>
      <h1>Nueva ruta</h1>
      <span></span>
    </header>

    <section class="route-location-card">
      <div class="location-row">
        <img src="../../assets/images/routes/Blue_location.png" alt="" />
        <span>Mi ubicación</span>
      </div>

      <div class="location-divider"></div>

      <div class="location-row">
        <img src="../../assets/images/routes/green_location.png" alt="" />
        <span>Av. Primavera 517</span>
      </div>

      <img class="action-icon" src="../../assets/images/routes/action_icon.png" alt="" />
    </section>

    <section class="route-type-card">
      <h2>Tipo de ruta</h2>
      <p>¿Qué prioriza tu ruta?</p>

      <button class="type-option safe" type="button" data-type="safe">
        <img src="../../assets/images/routes/Black_shield.png" alt="" />
        <div>
          <strong>Ruta segura</strong>
          <span>Prioriza tu seguridad</span>
        </div>
      </button>

      <button class="type-option fast" type="button" data-type="fast">
        <img src="../../assets/images/routes/Ray.png" alt="" />
        <div>
          <strong>Ruta rápida</strong>
          <span>Prioriza la ruta más corta</span>
        </div>
      </button>

      <button class="type-option basic" type="button" data-type="basic">
        <img src="../../assets/images/routes/Training_1.png" alt="" />
        <div>
          <strong>Ruta básica</strong>
          <span>Balanceado</span>
        </div>
      </button>
    </section>

    <button class="add-route-button" type="button">Agregar nueva ruta</button>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <a class="nav-item" href="../home/home.html">
        <img src="../../assets/images/routes/Home_icon.png" alt="" />
        <span>Inicio</span>
      </a>

      <a class="nav-item active" href="./routes_safe_routes.html">
        <img src="../../assets/images/routes/Routes_icon.png" alt="" />
        <span>Rutas</span>
      </a>

      <a class="nav-item" href="#">
        <img src="../../assets/images/routes/alert_icon.png" alt="" />
        <span>Alertas</span>
      </a>

      <a class="nav-item" href="#">
        <img src="../../assets/images/routes/report_icon.png" alt="" />
        <span>Reportes</span>
      </a>

      <a class="nav-item" href="../configuration/profile.html">
        <img src="../../assets/images/routes/configuration_icon.png" alt="" />
        <span>Perfil</span>
      </a>
    </nav>
  </main>

  <script src="../../assets/scripts/routes/routes_new_route.js"></script>
</body>
</html>
