<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reportes | SafeRoute</title>

    <link
        rel="stylesheet"
        href="../../assets/styles/global.css">

    <link
        rel="stylesheet"
        href="../../assets/styles/reports/reports.css">

</head>

<body>

<main class="reports-page">

    <header class="reports-header">

        <h1>Reportes</h1>

        <button
            class="notification-button"
            type="button"
            aria-label="Notificaciones">

            <img
                src="../../assets/images/reports/notification icon.png"
                alt="Notificaciones">

        </button>

    </header>

    <section class="reports-content">

        <button
            class="new-report-button"
            id="new-report">

            <img
                src="../../assets/images/reports/add report.png"
                alt="Nuevo Reporte">

            <span>Nuevo Reporte</span>

        </button>

        <section class="reports-tabs">

            <button
                id="allReports"
                class="tab-button active">

                Todos los reportes

            </button>

            <button
                id="myReports"
                class="tab-button">

                Mis reportes

            </button>

        </section>

        <!-- TODOS LOS REPORTES -->

        <section
            id="allReportsSection"
            class="reports-section">
<article class="report-card">

    <div class="report-icon">

        <img
            src="../../assets/images/reports/violence-card.png"
            alt="Violencia">

    </div>

    <div class="report-info">

        <h3>Violencia</h3>

        <p>Av. primavera, Surco</p>

    </div>

    <div class="report-details">

        <span class="report-time">
            Hace, 10 min
        </span>

        <span class="risk-tag high">
            Riesgo alto
        </span>

    </div>

</article>


<article class="report-card">

    <div class="report-icon">

        <img
            src="../../assets/images/reports/accident-card.png"
            alt="Accidente">

    </div>

    <div class="report-info">

        <h3>Accidente</h3>

        <p>Av. Velasco, Surco</p>

    </div>

    <div class="report-details">

        <span class="report-time">
            Hace, 2 horas
        </span>

        <span class="risk-tag low">
            Riesgo bajo
        </span>

    </div>

</article>


<article class="report-card">

    <div class="report-icon">

        <img
            src="../../assets/images/reports/suspicious-card.png"
            alt="Sospechoso">

    </div>

    <div class="report-info">

        <h3>Sospechoso</h3>

        <p>Av. Caminos del Inca, Surco</p>

    </div>

    <div class="report-details">

        <span class="report-time">
            Hace, 2 horas
        </span>

        <span class="risk-tag low">
            Riesgo bajo
        </span>

    </div>

</article>

<section class="achievement-card">

    <img
        src="../../assets/images/reports/achieves.png"
        alt="Impacto Comunitario">

</section>

<section
    id="myReportsSection"
    class="reports-section"
    hidden>

    <article class="report-card">

        <div class="report-icon">

            <img
                src="../../assets/images/reports/violence-card.png"
                alt="Violencia">

        </div>

        <div class="report-info">

            <h3>Violencia</h3>

            <p>Av. primavera, Surco</p>

        </div>

        <div class="report-details">

            <span class="report-time">
                Hace, 10 min
            </span>

            <span class="risk-tag high">
                Riesgo alto
            </span>

        </div>

    </article>

    <section class="achievement-card">

        <img
            src="../../assets/images/reports/achieves.png"
            alt="Impacto Comunitario">

    </section>

</section>

<nav class="bottom-navigation">

    <a class="nav-item" href="../home/home.html">

        <img
            src="../../assets/images/reports/home icon nav.png"
            alt="Inicio">

        <span>Inicio</span>

    </a>

    <a class="nav-item" href="../routes/routes.html">

        <img
            src="../../assets/images/reports/routes icon nav.png"
            alt="Rutas">

        <span>Rutas</span>

    </a>

    <a class="nav-item" href="../alerts/alerts.html">

        <img
            src="../../assets/images/reports/alerts icon nav.png"
            alt="Alertas">

        <span>Alertas</span>

    </a>

    <a class="nav-item active" href="#">

        <div class="nav-active-icon">

            <img
                src="../../assets/images/reports/reports icon nav.png"
                alt="Reportes">

            <span>Reportes</span>

        </div>

    </a>

    <a class="nav-item" href="../configuration/profile.html">

        <img
            src="../../assets/images/reports/profile icon nav.png"
            alt="Perfil">

        <span>Perfil</span>

    </a>

</nav>

</main>

<script src="../../assets/scripts/reports/reports.js"></script>

</body>

</html>
