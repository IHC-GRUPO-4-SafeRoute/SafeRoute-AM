<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reporte fallido</title>

    <link rel="stylesheet" href="../../assets/styles/global.css">
    <link rel="stylesheet" href="../../assets/styles/reports/status.css">

</head>

<body>

<div class="app-container">

    <main class="status-page">

        <div class="status-container">

            <img
                src="../../assets/images/reports/failure.png"
                class="status-icon">

            <h1
                class="status-title"
                data-i18n="reports.failure.title">

                Reporte fallido

            </h1>

            <p
                class="status-text"
                data-i18n="reports.failure.description">

                Tu reporte está incompleto, falta información obligatoria

            </p>

            <button
                class="status-button"
                onclick="history.back()">

                <span data-i18n="reports.failure.retry">
                    Reintentar
                </span>

            </button>

        </div>

    </main>

    <nav class="bottom-navigation">

        <a href="../home/home.html" class="nav-item">

            <img
                src="../../assets/images/reports/home icon nav.png"
                alt="Inicio">

            <span data-i18n="nav.home">
                Inicio
            </span>

        </a>

        <a href="../routes/routes_safe_routes.html" class="nav-item">

            <img
                src="../../assets/images/reports/routes icon nav.png"
                alt="Rutas">

            <span data-i18n="nav.routes">
                Rutas
            </span>

        </a>

        <a href="../alerts/alerts.html" class="nav-item">

            <img
                src="../../assets/images/reports/alerts icon nav.png"
                alt="Alertas">

            <span data-i18n="nav.alerts">
                Alertas
            </span>

        </a>

        <a href="#" class="nav-item active">

            <div class="nav-active-icon">

                <img
                    src="../../assets/images/reports/reports icon nav.png"
                    alt="Reportes">

                <span data-i18n="nav.reports">
                    Reportes
                </span>

            </div>

        </a>

        <a href="../configuration/profile.html" class="nav-item">

            <img
                src="../../assets/images/reports/profile icon nav.png"
                alt="Perfil">

            <span data-i18n="nav.profile">
                Perfil
            </span>

        </a>

    </nav>

</div>

<script src="../../assets/scripts/i18n/i18n.js"></script>

</body>

</html>
