<!DOCTYPE html>
<!--
    Pantalla: Cambiar clave

    HU relacionada:
    Pantalla complementaria
    Relación indirecta: US38 - Inicio de sesión seguro

    Criterios de aceptación cubiertos:
    - Validación de clave actual.
    - Validación de nueva clave y de confirmación.
    - Actualización de contraseña del usuario autenticado en localStorage.
    - Confirmación visual posterior al cambio exitoso.

    Nota:
    - No existe HU oficial exacta de "Cambiar clave"; esta pantalla complementa la seguridad de la cuenta.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar clave | SafeRoute</title>

    <link rel="stylesheet" href="../../assets/styles/global.css">
    <link rel="stylesheet" href="../../assets/styles/configuration/change-password.css">
</head>
<body>
    <main class="change-password-page">
        <header class="change-password-header">
            <div class="header-title-group">
                <button class="back-button" type="button" id="back-button" aria-label="Volver a configuración de seguridad">
                    <img src="../../assets/images/configuration/left-arrow.png" alt="">
                </button>

                <h1 data-i18n="changePassword.title">Cambiar de clave</h1>
            </div>

            <a class="notification-button" href="../notifications/notifications.html?returnTo=../configuration/change-password.html" aria-label="Ver notificaciones">
                <img src="../../assets/images/configuration/notification_main.png" alt="">
            </a>
        </header>

        <section class="change-password-content">
            <form class="change-password-form" id="change-password-form">
                <label class="password-group" for="current-password">
                    <span>Actual Clave</span>

                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="current-password"
                            autocomplete="current-password"
                            required
                        >

                        <button class="show-password-button" type="button" data-target="current-password" aria-label="Mostrar clave actual">
                            <img src="../../assets/images/configuration/close_eye.png" alt="">
                        </button>
                    </div>
                </label>

                <label class="password-group" for="new-password">
                    <span>Nueva Clave</span>

                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="new-password"
                            autocomplete="new-password"
                            required
                        >

                        <button class="show-password-button" type="button" data-target="new-password" aria-label="Mostrar nueva clave">
                            <img src="../../assets/images/configuration/close_eye.png" alt="">
                        </button>
                    </div>
                </label>

                <label class="password-group" for="confirm-password">
                    <span>Ingrese La Clave Nuevamente</span>

                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="confirm-password"
                            autocomplete="new-password"
                            required
                        >

                        <button class="show-password-button" type="button" data-target="confirm-password" aria-label="Mostrar confirmación de clave">
                            <img src="../../assets/images/configuration/close_eye.png" alt="">
                        </button>
                    </div>
                </label>

                <p class="change-password-message" id="change-password-message" aria-live="polite"></p>

                <button class="change-password-button" type="submit">
                    Cambiar clave
                </button>
            </form>
        </section>

        <nav class="bottom-navigation">
            <a class="nav-item" href="../home/home.html">
                <img src="../../assets/images/configuration/home.png" alt="">
                <span data-i18n="nav.home">Inicio</span>
            </a>

            <a class="nav-item" href="../routes/routes.html">
                <img src="../../assets/images/configuration/route.png" alt="">
                <span data-i18n="nav.routes">Rutas</span>
            </a>

            <a class="nav-item" href="../alerts/alerts.html">
                <img src="../../assets/images/configuration/alert.png" alt="">
                <span data-i18n="nav.alerts">Alertas</span>
            </a>

            <a class="nav-item" href="../reports/reports.html">
                <img src="../../assets/images/configuration/report.png" alt="">
                <span data-i18n="nav.reports">Reportes</span>
            </a>

            <a class="nav-item active" href="./profile.html">
                <img src="../../assets/images/configuration/profile.png" alt="">
                <span data-i18n="nav.profile">Perfil</span>
            </a>
        </nav>
    </main>

    <script src="../../assets/scripts/i18n/i18n.js"></script>
    <script src="../../assets/scripts/configuration/change-password.js"></script>
</body>
</html>
