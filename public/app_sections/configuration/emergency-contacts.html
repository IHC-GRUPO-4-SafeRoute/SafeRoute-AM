<!DOCTYPE html>
<!--
    HU-US25: Registro de contactos de emergencia

    COMO usuario que realiza desplazamientos nocturnos
    QUIERO registrar contactos de emergencia
    PARA notificarles automáticamente en situaciones de riesgo.

    Criterios de aceptación cubiertos:
    - Escenario 1: Registro exitoso de contacto.
      El usuario puede agregar un contacto válido y este se almacena en localStorage.
    - Escenario 2: Información inválida del contacto.
      Si el usuario deja campos incompletos o incorrectos, se muestra un mensaje de validación.

    Implementación adicional:
    - Los contactos no son estáticos: se renderizan desde JavaScript.
    - Se pueden agregar y eliminar contactos dinámicamente.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos de Emergencia | SafeRoute</title>

    <link rel="stylesheet" href="../../assets/styles/global.css">
    <link rel="stylesheet" href="../../assets/styles/configuration/emergency-contacts.css">
</head>
<body>
    <main class="emergency-page">
        <header class="emergency-header">
            <div class="header-title-group">
                <button class="back-button" type="button" id="back-button" aria-label="Volver al perfil">
                    <img src="../../assets/images/configuration/left-arrow.png" alt="">
                </button>

                <h1>Contactos de Emergencia</h1>
            </div>

            <button class="notification-button" type="button" aria-label="Ver notificaciones">
                <img src="../../assets/images/configuration/notification_main.png" alt="">
            </button>
        </header>

        <section class="emergency-content">
            <!-- AC US25 - Lista dinámica de contactos almacenados. -->
            <section class="contacts-list" id="contacts-list"></section>

            <!-- AC US25 - Botón para mostrar el formulario de nuevo contacto. -->
            <button class="add-contact-button" type="button" id="show-contact-form">
                <span class="add-icon-circle">
                    <img src="../../assets/images/configuration/plus.png" alt="">
                </span>
                <span>Agregar Contacto</span>
            </button>

            <!-- AC US25 - Formulario para registrar contacto válido. -->
            <form class="contact-form hidden" id="contact-form">
                <h2>Nuevo Contacto</h2>

                <label class="input-group" for="contact-name">
                    <input type="text" id="contact-name" placeholder="Ej. Ana Torres">
                </label>

                <label class="input-group" for="contact-relation">
                    <input type="text" id="contact-relation" placeholder="Ej. Hermana">
                </label>

                <label class="input-group" for="contact-phone">
                    <input type="tel" id="contact-phone" placeholder="+1 555-0000">
                </label>

                <p class="form-message" id="form-message" aria-live="polite"></p>

                <div class="form-actions">
                    <button class="cancel-button" type="button" id="cancel-contact">
                        Cancelar
                    </button>

                    <button class="submit-button" type="submit">
                        Agregar
                    </button>
                </div>
            </form>
        </section>

        <nav class="bottom-navigation">
            <a class="nav-item" href="../home/home.html">
                <img src="../../assets/images/configuration/home.png" alt="">
                <span>Inicio</span>
            </a>

            <a class="nav-item" href="../routes/routes.html">
                <img src="../../assets/images/configuration/route.png" alt="">
                <span>Rutas</span>
            </a>

            <a class="nav-item" href="../alerts/alerts.html">
                <img src="../../assets/images/configuration/alert.png" alt="">
                <span>Alertas</span>
            </a>

            <a class="nav-item" href="../reports/reports.html">
                <img src="../../assets/images/configuration/report.png" alt="">
                <span>Reportes</span>
            </a>

            <a class="nav-item active" href="./profile.html">
                <img src="../../assets/images/configuration/profile.png" alt="">
                <span>Perfil</span>
            </a>
        </nav>
    </main>

    <script src="../../assets/scripts/configuration/emergency-contacts.js"></script>
</body>
</html>
