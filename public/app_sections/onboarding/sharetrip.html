<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Share Trip | SafeRoute</title>

    <link rel="stylesheet" href="../../assets/styles/global.css">
    <link rel="stylesheet" href="../../assets/styles/onboarding/saferoutes.css">

</head>

<body>

    <main class="onboarding-page">


        <!--
        HU: US34 - Onboarding interactivo de SafeRoute

        Criterio de aceptación:
        - El sistema debe permitir avanzar o saltar el onboarding.
        -->
        
        <a href="#" class="skip-button" id="skip-button">Omitir</a>


        <!--
        HU: US34 - Onboarding interactivo de SafeRoute

        Criterio de aceptación:
        - El sistema debe mostrar pantallas introductorias
          sobre las funciones principales.-->
        
        <section class="onboarding-content">

            <img
                src="../../assets/images/onboarding/sharetrip.png"
                alt="Comparte tu trayecto"
                class="onboarding-image sharetrip-image"
            >

            <h1 class="onboarding-title">
                Comparte tu trayecto
            </h1>

            <p class="onboarding-description">
                Permite que tus contactos de confianza
                sigan tu ubicación cuando estés en movimiento
            </p>

        </section>


        <!--
        HU: US34 - Onboarding interactivo de SafeRoute

        Criterio de aceptación:
        - El usuario debe visualizar las pantallas introductorias
          del onboarding.

        Implementación:
        - Los indicadores muestran la posición actual del usuario
          dentro del recorrido de introducción.
        -->
        <section class="progress-indicator">

            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot active"></span>
            <span class="dot"></span>

        </section>


        <!--
        HU: US34 - Onboarding interactivo de SafeRoute

        Criterio de aceptación:
        - Al seleccionar la opción "Comenzar", el sistema debe
          redirigir al usuario a la pantalla principal de la aplicación.
        -->

        
        <button
            class="primary-button"
            id="next-button"
            type="button">
            Comenzar
        </button>


    </main>


    <script src="../../assets/scripts/onboarding/sharetrip.js"></script>


</body>

</html>
