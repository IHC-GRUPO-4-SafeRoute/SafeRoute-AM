<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rutas guardadas | SafeRoute</title>

  <link rel="stylesheet" href="../../assets/styles/global.css" />
  <link rel="stylesheet" href="../../assets/styles/routes/routes_saved_empty.css" />
</head>

<body>
  <main class="saved-routes-page">
    <header class="saved-routes-header">
      <button class="back-button" type="button" aria-label="Volver">&lt;</button>

      <div class="header-title">
        <h1>Rutas frecuentes</h1>
      </div>

      <button class="ring-button" type="button" aria-label="Notificaciones">
        <img src="../../assets/images/routes/Ring_icon.png" alt="" />
      </button>
    </header>

    <section class="saved-routes-card">
      <div class="frequent-tabs">
        <button class="tab-button" type="button">Favoritas</button>
        <button class="tab-button active" type="button">Guardadas</button>
      </div>

      <p>No se encuentran rutas nuevas guardadas</p>
    </section>

    <button class="save-route-button" type="button">
      <span>+</span>
      Guardar nueva ruta
    </button>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <a class="nav-item" href="../home/home.html">
        <img src="../../assets/images/routes/Home_icon.png" alt="" />
        <span data-i18n="nav.home">Inicio</span>
      </a>

      <a class="nav-item active" href="./routes_safe_routes.html">
        <img src="../../assets/images/routes/Routes_icon.png" alt="" />
        <span data-i18n="nav.routes">Rutas</span>
      </a>

      <a class="nav-item" href="#">
        <img src="../../assets/images/routes/alert_icon.png" alt="" />
        <span data-i18n="nav.alerts">Alertas</span>
      </a>

      <a class="nav-item" href="#">
        <img src="../../assets/images/routes/report_icon.png" alt="" />
        <span data-i18n="nav.reports">Reportes</span>
      </a>

      <a class="nav-item" href="../configuration/profile.html">
        <img src="../../assets/images/routes/configuration_icon.png" alt="" />
        <span data-i18n="nav.profile">Perfil</span>
      </a>
    </nav>
  </main>

  <script src="../../assets/scripts/i18n/i18n.js"></script>
<script src="../../assets/scripts/routes/routes_saved_empty.js"></script>
</body>
</html>
