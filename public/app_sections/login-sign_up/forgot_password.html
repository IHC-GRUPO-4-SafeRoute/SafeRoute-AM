<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olvidé mi contraseña | SafeRoute</title>

    <link rel="stylesheet" href="../../assets/styles/global.css">
    <link rel="stylesheet" href="../../assets/styles/login-sign_up/forgot_password.css">
</head>

<body>
    <main class="forgot-page">
        <header class="forgot-header">
            <h1>Olvidé la contraseña</h1>
        </header>


        <section class="forgot-content">

            <div class="forgot-information">

                <h2>
                    ¿Restaurar contraseña?
                </h2>

                <p>
                    Ingresa el correo electrónico con el que te registraste
                    para continuar con la recuperación de tu contraseña.
                </p>

            </div>


            <form
                id="forgot-password-form"
                class="forgot-form"
            >

                <div class="forgot-group">

                    <label for="forgot-email">
                        Ingresa tu correo electrónico
                    </label>

                    <input
                        type="email"
                        id="forgot-email"
                        name="email"
                        placeholder="example@example.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <p
                    id="forgot-message"
                    class="forgot-message"
                    aria-live="polite"
                ></p>


                <button
                    type="submit"
                    class="next-button"
                >
                    Siguiente
                </button>


                <a
                    href="register.html"
                    class="register-link"
                >
                    Registrarse
                </a>

            </form>


            <div class="forgot-social">

                <p class="forgot-social-text">
                    O regístrate con
                </p>

                <div class="social-buttons">

                    <button
                        type="button"
                        class="social-button"
                        aria-label="Continuar con Google"
                    >
                        <img
                            src="../../assets/images/login-sign_up/icon-google.png"
                            alt=""
                        >
                    </button>

                    <button
                        type="button"
                        class="social-button"
                        aria-label="Continuar con Facebook"
                    >
                        <img
                            src="../../assets/images/login-sign_up/icon-facebook.png"
                            alt=""
                        >
                    </button>

                    <button
                        type="button"
                        class="social-button"
                        aria-label="Continuar con X"
                    >
                        <img
                            src="../../assets/images/login-sign_up/icon-X.png"
                            alt=""
                        >
                    </button>

                </div>

            </div>

            <footer class="forgot-footer">

                <p>
                    ¿No tienes una cuenta?

                    <a href="register.html">
                        Regístrate
                    </a>
                </p>

            </footer>
        </section>
    </main>
    <script src="../../assets/scripts/i18n/i18n.js"></script>
<script src="../../assets/scripts/login-sign_up/forgot_password.js"></script>
</body>
</html>
